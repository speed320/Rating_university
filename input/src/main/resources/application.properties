spring.application.name=input

#liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
#database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/input_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
#rabbitmq
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
rabbitmq.exchange.rating=${RABBITMQ_RATING_EXCHANGE:rating.exchange}
rabbitmq.routing-key=${RABBITMQ_ROUTING-KEY:rating.calculation}
#security
jwt.secret=${JWT_SECRET:myDefaultSecretKeyForLocalTests1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}